# Style config for contributors. The code targets PEP 8 with a 88-column limit
# (black's default) rather than 79, which suits the wide report tables.
#
#   pycodestyle analyze.py
#   python3 -m unittest discover -s tests

[pycodestyle]
max-line-length = 88

[flake8]
max-line-length = 88
extend-ignore = E203
